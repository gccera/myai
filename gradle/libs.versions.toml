# Exact, pinned versions (latest stable as of Nov 2026).
[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
androidxHilt = "1.4.0"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.1"
composeBom = "2026.11.01"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
coroutines = "1.11.0"
serialization = "1.13.0"
okhttp = "5.5.1"
# On-device inference
litertlm = "0.20.0"
onnxruntime = "1.32.0"
markdown = "0.46.0"
# Phase 2
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"
mlkitTextRecognition = "16.0.1"
pdfbox = "2.0.27.0"
# Phase 3
sora = "0.24.7"
jgit = "5.13.5.202508271544-r"   # 5.13.x is the last JGit line targeting Java 8 APIs available on Android 8+
diffUtils = "4.18"
webkit = "1.18.0"
documentfile = "1.1.0"
chaquopy = "17.2.0"
desugar = "2.1.5"
browser = "1.10.0"
# Tests
junit = "4.13.2"
androidxJunit = "1.3.0"

